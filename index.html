<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-image: url(https://contents.smsupermalls.com/data/uploads/2021/11/smcinemanov17SM_Cinemas_are_back_and_better_than_ever_2.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header{
            text-align: center;
        }
        section{
               background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }
        input[type="submit"]{
            width: 100%
        }
    </style>
</head>
<body>
    <header>
        <h1>Rate a Movie</h1>
        <br>
        <p></p>
    </header>
    <br>

    <section>
    <form action="">
        <img src="https://png.pngtree.com/png-vector/20190816/ourmid/pngtree-film-logo-design-template-vector-isolated-illustration-png-image_1693431.jpg" alt="Movie Logo">
        <label for="movie">Movie Title</label>
        <br>

        <input type="text" id="movie" name="movie" placeholder="Enter Here"> <br>


        <br>

        <label for=""><b>Genre/s</b></label>
        <br>
        <input type="checkbox" id="genre1" name="genre">
        <label for="genre">Action</label>
        <input type="checkbox" id="genre2" name="genre">
        <label for="genre2">Comedy</label>
        <input type="checkbox" id="genre3" name="genre">
        <label for="genre3">Drama</label>
        <input type="checkbox" id="genre4" name="genre">
        <label for="genre4">Horror</label>
        <input type="checkbox" id="genre5" name="genre">
        <label for="genre5">Romance</label>
        <input type="checkbox" id="genre6" name="genre">
        <label for="genre6">Sci-Fi</label>
        <input type="checkbox" id="genre7" name="genre">
        <label for="genre7">Thriller</label>
        <br>

        <br>
        <label for="rating"><b>Rating</b></label>
        <br>
        <input type="radio" id="rate1" name="rate">
        <label for="rate1">⭐</label>
         <input type="radio" id="rate2" name="rate">
        <label for="rate2">⭐⭐</label>
         <input type="radio" id="rate3" name="rate">
        <label for="rate3">⭐⭐⭐</label>
         <input type="radio" id="rate4" name="rate">
        <label for="rate4">⭐⭐⭐⭐</label>
         <input type="radio" id="rate5" name="rate">
        <label for="rate5">⭐⭐⭐⭐⭐</label>
        <br>

        <br>
        <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
        <br>

        <input type="submit" id="submit" value="Submit Review">
        <br>

        Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a> for the guide in making a review.
    </form>
    </section>

    <!--Reference 
        Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/ 
    -->
</body>
</html>
